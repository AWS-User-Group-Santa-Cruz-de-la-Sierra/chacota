# Amplify Hosting build for the Next.js web app (pnpm monorepo, app in apps/web).
# Set AMPLIFY_MONOREPO_APP_ROOT=apps/web in the Amplify app. Runtime variables are copied into
# .env.production because Amplify only exposes them to the build, not to the SSR compute.
version: 1
applications:
  - appRoot: apps/web
    frontend:
      phases:
        preBuild:
          commands:
            - nvm install 22 && nvm use 22
            - corepack enable
            # Amplify's packager needs real folders in node_modules, not pnpm's symlinks.
            - (cd ../.. && pnpm install --frozen-lockfile --config.node-linker=hoisted)
        build:
          commands:
            - env | grep -E '^(AMPLIFY_APP_ORIGIN|COGNITO_|CHACOTA_|GAME_API_URL|EVENTS_|MEDIA_)' > .env.production
            - pnpm build
            # Turbopack links external server packages (@aws-sdk/client-s3-<hash>...) into
            # .next/node_modules with relative symlinks to the repo root, which break once Amplify
            # moves the bundle to /var/task. Replace them with real copies.
            - |
              [ ! -d .next/node_modules ] || find .next/node_modules -type l | while read -r l; do
                t=$(readlink -f "$l") && [ -e "$t" ] || { echo "Broken link $l"; exit 1; }
                rm "$l" && cp -R "$t" "$l"
              done
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - .next/cache/**/*
